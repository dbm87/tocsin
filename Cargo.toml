[workspace]
resolver = "3"
members = ["crates/tocsin-core", "crates/tocsin-inventory", "crates/tocsin-sources", "crates/tocsin-agent"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/dbm87/tocsin"
rust-version = "1.88"

[workspace.dependencies]
tocsin-core = { path = "crates/tocsin-core" }
tocsin-inventory = { path = "crates/tocsin-inventory" }
tocsin-sources = { path = "crates/tocsin-sources" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"
ureq = { version = "2", features = ["json"] }
url = "2"
